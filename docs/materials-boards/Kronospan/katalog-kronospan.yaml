# --- PŁYTY WIÓROWE LAMINOWANE ---
chipboard_laminated:
  name: Płyta wiórowa laminowana
  base: Płyta wiórowa
  coating: Papier dekoracyjny + żywica melaminowa
  applications:
    - Korpusy meblowe
    - Fronty
    - Półki
    - Blaty robocze (grubsze)
  thicknesses: [16, 18, 22, 25, 28, 30, 36, 38]
  moisture_classes:
    P2: Standardowa
    P3: Podwyższona odporność
    V313: Wodoodporna (do łazienek/kuchni)
  fire_class: B-s1-d0 (opcja)
  collections:
    - name: Global Collection
      description: Główna kolekcja dekorów
      features: ["Łatwy montaż", "Odporność na zabrudzenia", "Stabilność UV"]
      
    - name: Emporio Skin
      description: Włoska kolekcja premium
      designer: Włoscy projektanci
      features: ["Struktura Follow-the-look", "Efekt naturalnych materiałów"]
      structures: [PD, PW]
      
    - name: Focus (Falco Exclusive)
      description: Kolekcja ekskluzywna
      formats: ["2800 x 2070 mm"]

