# ══════════════════════════════════════════════════════════════════
# Kronospan — Sample Data (Phase 3 import test)
# ══════════════════════════════════════════════════════════════════
# Minimal but complete subset: enough to validate the full import
# pipeline from YAML → SQLite for one real producer.
#
# Data sources:
#   - Global Collection 2026: global-collection.md str. 6-31
#   - Postformed worktops:    blaty_postformed_spec.md str. 48
#   - Slim Line:              blaty_slim_line_spec.md str. 64-65
# ══════════════════════════════════════════════════════════════════


# ──────────────────────────────────────────────────────────────────
# 1. PRODUCERS
# ──────────────────────────────────────────────────────────────────
producers:
  - slug: kronospan
    name: Kronospan
    country: Polska
    website: kronosfera.pl


# ──────────────────────────────────────────────────────────────────
# 2. STRUCTURES (subset from global-collection.md)
# ──────────────────────────────────────────────────────────────────
structures:
  # Kronospan Global Collection structures (producer-scoped)
  - code: SM
    name: Super Mat
    type: smooth
    finish: matt
    producer_slug: kronospan

  - code: PE
    name: Pearl Effect
    type: structured
    finish: gloss
    producer_slug: kronospan

  - code: BS
    name: Black Structure
    type: structured
    finish: matt
    producer_slug: kronospan

  - code: PD
    name: Pearl Dark
    type: structured
    finish: matt
    producer_slug: kronospan

  - code: PW
    name: Pearl Wood
    type: wood_grain
    finish: structured
    producer_slug: kronospan

  - code: RS
    name: Rustykalna
    type: wood_grain
    finish: structured
    producer_slug: kronospan

  - code: SU
    name: Super Ultra Mat
    type: smooth
    finish: matt
    fingerprint_resistant: true
    producer_slug: kronospan

  - code: LV
    name: Lava
    type: stone
    finish: matt
    producer_slug: kronospan


# ──────────────────────────────────────────────────────────────────
# 3. COLLECTIONS
# ──────────────────────────────────────────────────────────────────
collections:
  - slug: kronospan-global
    producer_slug: kronospan
    name: Global Collection 2026
    source_pdf: plyty-wiorowe-global-collection.pdf
    has_edgebanding: true
    has_hdf: true
    has_countertops: true
    has_express: true

  - slug: kronospan-postformed
    producer_slug: kronospan
    name: Global Collection 2026 — Blaty Post-formed
    source_pdf: blaty.pdf
    has_edgebanding: true
    has_countertops: true
    has_express: true

  - slug: kronospan-slim-line
    producer_slug: kronospan
    name: Slim Line
    source_pdf: blaty.pdf
    has_edgebanding: false
    has_countertops: true
    has_express: true


# ──────────────────────────────────────────────────────────────────
# 4. MATERIALS
# ──────────────────────────────────────────────────────────────────
materials:
