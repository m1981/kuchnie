# ──────────────────────────────────────────────────────────────────
# 6. VARIANTS (one or more per decor, different thickness/material/structure)
# ──────────────────────────────────────────────────────────────────
variants:
  # ── K8685 as chipboard 18mm, structure SM ──────────────────────
  - business_id: K8685-CH-18-SM
    decor_code: K8685
    material_slug: kronospan-chipboard-global
    structure_code: SM
    thickness_mm: 18.0
    sheet_format_slug: 2800x2070
    roles: [front, carcass]
    hpl_available: true
    multi_structures: "BS, PD, PW"

  # ── K190 as chipboard 18mm, structure PE ───────────────────────
  - business_id: K190-CH-18-PE
    decor_code: K190
    material_slug: kronospan-chipboard-global
    structure_code: PE
    thickness_mm: 18.0
    sheet_format_slug: 2800x2070
    roles: [front, carcass]
    hpl_available: true
    multi_structures: "PD, PW"

  # ── 868S as postformed worktop, 38mm, structure RS, 600mm wide ─
  - business_id: 868S-PF-U-600
    decor_code: "868S"
    material_slug: kronospan-postformed-global
    structure_code: RS
    thickness_mm: 38.0
    sheet_format_slug: 4100x600
    roles: [worktop]
    splashback_available: true
    hpl_available: true

  # ── 7045 as postformed worktop, 38mm, structure RS, 900mm wide ─
  - business_id: 7045-PF-UU-900
    decor_code: "7045"
    material_slug: kronospan-postformed-global
    structure_code: RS
    thickness_mm: 38.0
    sheet_format_slug: 4100x900
    roles: [worktop]
    splashback_available: true
    hpl_available: true

  # ── K749 as Slim Line 12mm, structure LV ───────────────────────
  - business_id: K749-SL-12
    decor_code: K749
    material_slug: kronospan-slim-line-board
    structure_code: LV
    thickness_mm: 12.0
    sheet_format_slug: 4100x650
    roles: [worktop]


# ──────────────────────────────────────────────────────────────────
# 7. WORKTOPS (specs for worktop-role variants only)
# ──────────────────────────────────────────────────────────────────
worktops:
  - variant_business_id: 868S-PF-U-600
    construction_slug: postformed
    profile_code: U
    max_length_mm: 4100
    available_widths_mm: [600]
    edge_material: Unoflex
    edge_material_thickness_mm: 1.0
    splashback_available: true
    matching_board_available: true
    pieces_per_pallet: 10
    pallet_weight_kg: 620

  - variant_business_id: 7045-PF-UU-900
    construction_slug: postformed
    profile_code: "U-U"
    max_length_mm: 4100
    available_widths_mm: [900, 1200]
    edge_material: Unoflex
    edge_material_thickness_mm: 1.0
    splashback_available: true
    matching_board_available: true
    pieces_per_pallet: 10
    pallet_weight_kg: 946

  - variant_business_id: K749-SL-12
    construction_slug: slim_line
    profile_code: NATURAL
    max_length_mm: 4100
    available_widths_mm: [650]
    edge_material: naturalna
    core_color: Beżowy


# ──────────────────────────────────────────────────────────────────
# 8. DECOR_STRUCTURES (M2M junction: which structures for each decor)
# ──────────────────────────────────────────────────────────────────
decor_structures:
  # K8685 Biel Alpejska: SM (primary) + BS, PD, PW
  - decor_code: K8685
    structure_code: SM
    is_primary: true
  - decor_code: K8685
    structure_code: BS
    is_primary: false
  - decor_code: K8685
    structure_code: PD
    is_primary: false
  - decor_code: K8685
    structure_code: PW
    is_primary: false

  # K190 Czarny: PE (primary) + PD, PW
  - decor_code: K190
    structure_code: PE
    is_primary: true
  - decor_code: K190
    structure_code: PD
    is_primary: false
  - decor_code: K190
    structure_code: PW
    is_primary: false

  # K749 Babylon Slate: LV (primary only)
  - decor_code: K749
    structure_code: LV
    is_primary: true


# ──────────────────────────────────────────────────────────────────
# 9. PAIRINGS (matching products across material types)
# ──────────────────────────────────────────────────────────────────
pairings:
  # K8685 (board) → 868S (worktop)
  - front_decor_code: K8685
    target_decor_code: "868S"
    pairing_type: worktop
    match_type: exact
    priority: 1

  # K8685 (board) → K8685 (acrylic — same decor, different material)
  # (In reality there'd be a K8685-AG decor. We simulate with K523 as
  # a close match to show the acrylic pairing type works.)
  - front_decor_code: K8685
    target_decor_code: K523
    pairing_type: acrylic
    match_type: close
    priority: 2
    notes: "Close match — in production, K8685-AG would be the exact target"

  # K190 (board) → 7045 (worktop as close match for champagne tones)
  - front_decor_code: K190
    target_decor_code: "7045"
    pairing_type: worktop
    match_type: close
    priority: 2
    notes: "Close match for dark worktop pairing"
