# Typy powierzchni - mapowanie midzy producentami
# Klucz = wspolna koncepcja, wartosci = kody struktur per producent
surface_types:
  smooth_matt:
    label: "Gadki mat"
    description: "Gadka powierzchnia, brak faktury"
    kronospan_structures: [SM, BS, SU]
    swiss_krono_structures: [VL, SM]
    egger_structures: [ST9, ST15]

  pearl_silk:
    label: "Perowy jedwab"
    description: "Delikatny polysk perlowy"
    kronospan_structures: [PE, PD]
    swiss_krono_structures: []
    egger_structures: []

  wood_grain:
    label: "Faktura drewna"
    description: "Wyczuwalna struktura slojow"
    kronospan_structures: [PW, SN, RW, HU, AD, PV]
    swiss_krono_structures: [OW, OV, NA, MX]
    egger_structures: [ST32, ST36]

  stone:
    label: "Kamien / Beton"
    description: "Faktura mineralna"
    kronospan_structures: [RT, PN]
    swiss_krono_structures: [KM, TO]
    egger_structures: [ST15, ST87]

  gloss:
    label: "Polysk"
    description: "Wysoki polysk lustrzany"
    kronospan_structures: [AG, MG]
    swiss_krono_structures: [SE, SQ]
    egger_structures: [HG, PG]

  metal:
    label: "Metal"
    description: "Powierzchnia metaliczna"
    kronospan_structures: [AL]
    swiss_krono_structures: []
    egger_structures: []
