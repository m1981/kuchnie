<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katalog Materiałów</title>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
  <style>
    :root {
      --bg: #f5f5f5;
      --card: #ffffff;
      --border: #e0e0e0;
      --accent: #2c5f4a;
      --accent-light: #e8f0ec;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --warm: #c8832a;
      --badge-new: #c8832a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 18px; font-weight: 700; color: var(--accent); }
    header .meta { font-size: 12px; color: var(--muted); }

    /* ── Filter rows ── */
    .filter-section {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--muted);
      min-width: 70px;
      flex-shrink: 0;
    }
    .filter-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      align-items: center;
    }
    input[type="search"] {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      min-width: 220px;
    }
    input[type="search"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-light);
    }

    /* ── Chips ── */
    .chip {
      padding: 3px 10px;
      border-radius: 16px;
      font-size: 11px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      transition: all 0.15s;
      white-space: nowrap;
    }
    .chip:hover { border-color: var(--accent); }
    .chip.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .chip .count {
      font-size: 9px;
      opacity: 0.7;
      margin-left: 2px;
    }

    .stats {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── Main grid ── */
    main { padding: 24px; max-width: 1400px; margin: 0 auto; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.15s, transform 0.1s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); transform: translateY(-1px); }
    .card-swatch {
      height: 120px;
      background: linear-gradient(135deg, #d4cfc7 0%, #e8e4dc 100%);
      position: relative;
      overflow: hidden;
    }
    .card-swatch img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-badges {
      position: absolute;
      top: 6px;
      left: 6px;
      display: flex;
      gap: 4px;
    }
    .badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 0.3px;
    }
    .badge-producer { background: rgba(0,0,0,0.6); color: white; }
    .badge-new { background: var(--badge-new); color: white; }
    .badge-surface {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(255,255,255,0.9);
      color: var(--text);
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 3px;
      backdrop-filter: blur(4px);
    }

    .card-body { padding: 10px 12px; }
    .card-body .name { font-size: 14px; font-weight: 600; line-height: 1.3; }
    .card-body .code { font-size: 11px; color: var(--muted); font-family: monospace; }
    .card-body .structure-info {
      font-size: 11px;
      color: var(--accent);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-body .structure-info .struct-type {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--accent-light);
    }
    .card-body .tags { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 6px; }
    .card-body .tag {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      background: #f0f0f0;
      color: var(--muted);
    }

    /* ── Detail overlay ── */
    .detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .detail-panel {
      background: var(--card);
      border-radius: 12px;
      width: 90%;
      max-width: 700px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 28px;
    }
    .detail-close {
      float: right;
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: var(--muted);
      line-height: 1;
    }
    .detail-close:hover { color: var(--text); }
    .detail-header { display: flex; gap: 20px; margin-bottom: 20px; }
    .detail-img {
      width: 160px;
      height: 160px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: linear-gradient(135deg, #d4cfc7 0%, #e8e4dc 100%);
    }
    .detail-img img { width: 100%; height: 100%; object-fit: cover; }
    .detail-info h2 { font-size: 22px; margin-bottom: 4px; }
    .detail-info .code { font-size: 13px; color: var(--muted); font-family: monospace; }
    .detail-info .structure-desc {
      margin-top: 8px;
      padding: 8px 12px;
      background: var(--accent-light);
      border-radius: 6px;
      font-size: 13px;
      color: var(--accent);
    }

    .detail-section { margin-top: 20px; }
    .detail-section h3 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .detail-table th {
      text-align: left;
      padding: 6px 8px;
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 600;
      font-size: 11px;
    }
    .detail-table td {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }
    .detail-table tr:last-child td { border-bottom: none; }

    .loading { text-align: center; padding: 60px; color: var(--muted); }
    .error { text-align: center; padding: 40px; color: #dc3545; }
  </style>
</head>
<body x-data="catalog()" x-init="load()">

  <!-- ══ HEADER ══ -->
  <header>
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <h1>Katalog Materiałów</h1>
      <div class="meta">
        <span x-text="meta.generated ? new Date(meta.generated).toLocaleString('pl') : ''"></span>
        <span x-show="totalDecors > 0" x-text="' · ' + totalDecors + ' dekorów'"></span>
      </div>
    </div>

    <!-- Search -->
    <div class="filter-section">
      <input type="search" x-model="search" placeholder="Szukaj dekoru, kodu, tagu..." />
      <span class="stats">
        <span x-text="filtered.length"></span> / <span x-text="allDecors.length"></span>
      </span>
    </div>

    <!-- Producers -->
    <div class="filter-section" x-show="producers.length > 1">
      <span class="filter-label">Producent</span>
      <div class="filter-row">
        <template x-for="p in producers" :key="p">
          <button class="chip" :class="activeProducer === p && 'active'" @click="toggle('activeProducer', p)">
            <span x-text="p"></span>
            <span class="count" x-text="'(' + producerCount(p) + ')'"></span>
          </button>
        </template>
      </div>
    </div>

    <!-- Surface types -->
    <div class="filter-section" x-show="surfaceTypeOptions.length > 0">
      <span class="filter-label">Powierzchnia</span>
      <div class="filter-row">
        <template x-for="st in surfaceTypeOptions" :key="st.key">
          <button class="chip" :class="activeSurfaceType === st.key && 'active'" @click="toggle('activeSurfaceType', st.key)">
            <span x-text="st.label"></span>
            <span class="count" x-text="'(' + st.count + ')'"></span>
          </button>
        </template>
      </div>
    </div>

    <!-- Structures -->
    <div class="filter-section" x-show="structureOptions.length > 0">
      <span class="filter-label">Struktura</span>
      <div class="filter-row">
        <template x-for="s in structureOptions" :key="s.code">
          <button class="chip" :class="activeStructure === s.code && 'active'" @click="toggle('activeStructure', s.code)" :title="s.name">
            <span x-text="s.code"></span>
            <span class="count" x-text="'(' + s.count + ')'"></span>
          </button>
        </template>
      </div>
    </div>

    <!-- Tags -->
    <div class="filter-section" x-show="tagOptions.length > 0">
      <span class="filter-label">Tagi</span>
      <div class="filter-row">
        <template x-for="t in tagOptions.slice(0, showAllTags ? 999 : 12)" :key="t.tag">
          <button class="chip" :class="activeTag === t.tag && 'active'" @click="toggle('activeTag', t.tag)">
            <span x-text="t.tag"></span>
            <span class="count" x-text="'(' + t.count + ')'"></span>
          </button>
        </template>
        <button class="chip" x-show="tagOptions.length > 12" @click="showAllTags = !showAllTags" x-text="showAllTags ? 'mniej' : '...'"></button>
      </div>
    </div>

    <!-- Material type -->
    <div class="filter-section" x-show="materialOptions.length > 1">
      <span class="filter-label">Materiał</span>
      <div class="filter-row">
        <template x-for="m in materialOptions" :key="m.key">
          <button class="chip" :class="activeMaterial === m.key && 'active'" @click="toggle('activeMaterial', m.key)">
            <span x-text="m.label"></span>
            <span class="count" x-text="'(' + m.count + ')'"></span>
          </button>
        </template>
      </div>
    </div>

    <!-- Color family -->
    <div class="filter-section" x-show="colorFamilyOptions.length > 0">
      <span class="filter-label">Kolor</span>
      <div class="filter-row">
        <template x-for="cf in colorFamilyOptions.slice(0, showAllColors ? 999 : 10)" :key="cf.key">
          <button class="chip" :class="activeColorFamily === cf.key && 'active'" @click="toggle('activeColorFamily', cf.key)">
            <span x-text="cf.key"></span>
            <span class="count" x-text="'(' + cf.count + ')'"></span>
          </button>
        </template>
        <button class="chip" x-show="colorFamilyOptions.length > 10" @click="showAllColors = !showAllColors" x-text="showAllColors ? 'mniej' : '...'"></button>
      </div>
    </div>
  </header>

  <!-- ══ CONTENT ══ -->
  <main>
    <div x-show="loading" class="loading">Ładowanie katalogu...</div>
    <div x-show="error" class="error" x-text="error"></div>

    <div x-show="!loading && !error" class="grid">
      <template x-for="decor in filtered" :key="decor._key">
        <div class="card" @click="openDetail(decor)">
          <div class="card-swatch">
            <template x-if="decor._imgPath">
              <img :src="decor._imgPath" :alt="decor.name" loading="lazy" />
            </template>
            <span x-show="!decor._imgPath" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase">brak zdjęcia</span>
            <div class="card-badges">
              <span class="badge badge-producer" x-text="decor._producerShort"></span>
            </div>
            <span class="badge-surface" x-text="decor._surfaceTypeShort" x-show="decor._surfaceTypeShort"></span>
          </div>
          <div class="card-body">
            <div class="name" x-text="decor.name"></div>
            <div class="code" x-text="decor.id"></div>
            <div class="structure-info">
              <span x-text="decor._allStructures"></span>
              <span class="struct-type" x-text="decor.structure"></span>
            </div>
            <div style="font-size:11px; color:var(--muted); margin-top:2px" x-text="decor._materialLabel"></div>
            <div class="tags" x-show="decor.tags && decor.tags.length">
              <template x-for="tag in (decor.tags || []).slice(0, 4)" :key="tag">
                <span class="tag" x-text="tag"></span>
              </template>
            </div>
          </div>
        </div>
      </template>
    </div>

    <div x-show="!loading && !error && filtered.length === 0" class="loading">
      Brak wyników dla "<span x-text="search"></span>"
    </div>
  </main>

  <!-- ══ DETAIL OVERLAY ══ -->
  <template x-if="selected">
    <div class="detail-overlay" @click.self="selected = null" @keydown.escape.window="selected = null">
      <div class="detail-panel">
        <button class="detail-close" @click="selected = null">&times;</button>

        <div class="detail-header">
          <div class="detail-img">
            <template x-if="selected._imgPath">
              <img :src="selected._imgPath" :alt="selected.name" />
            </template>
          </div>
          <div class="detail-info">
            <h2 x-text="selected.name"></h2>
            <div class="code" x-text="selected.id"></div>
            <div style="margin-top:6px; font-size:12px; color:var(--muted)">
              <span x-text="selected._producer"></span>
              <span x-show="selected.group"> · <span x-text="selected.group"></span></span>
              <span x-show="selected._materialLabel"> · <span x-text="selected._materialLabel"></span></span>
            </div>
            <div x-show="selected.roles" style="margin-top:4px; font-size:11px; color:var(--accent)">
              Zastosowanie: <span x-text="(selected.roles || []).join(', ')"></span>
            </div>
            <div class="structure-desc" x-show="selected._structureDesc">
              <div style="display:flex; align-items:center; gap:12px; margin-bottom:8px">
                <img :src="`/producers/${selected._producer}/structures/${selected.structure}.jpg`" :alt="selected.structure" style="width:80px; height:80px; border-radius:6px; object-fit:cover" onerror="this.style.display='none'" />
                <div>
                  <strong x-text="selected._allStructures"></strong>
                  <div style="font-size:12px; color:var(--muted); margin-top:2px" x-text="selected._structureDesc"></div>
                  <div x-show="selected._multiStructures" style="font-size:11px; color:var(--accent); margin-top:4px">
                    Dostepne tez w strukturach: <span x-text="selected._multiStructures"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Produkty / Parametry -->
        <div class="detail-section">
          <h3>Parametry</h3>
          <table class="detail-table">
            <tr x-show="selected.thickness_mm">
              <td>Grubość</td>
              <td><strong x-text="selected.thickness_mm + ' mm'"></strong></td>
            </tr>
            <tr x-show="selected.format">
              <td>Format arkusza</td>
              <td x-text="selected.format ? selected.format.join(' × ') + ' mm' : ''"></td>
            </tr>
            <tr x-show="selected.sidedness">
              <td>Stronność</td>
              <td x-text="sidednessLabel(selected.sidedness)"></td>
            </tr>
            <tr x-show="selected.konfekcja !== undefined">
              <td>Konfekcja</td>
              <td x-text="selected.konfekcja ? 'Tak' : 'Nie'"></td>
            </tr>
            <tr x-show="selected.express && selected.express.length">
              <td>Express 24h</td>
              <td x-text="(selected.express || []).map(e => e + 'mm').join(', ')"></td>
            </tr>
          </table>
        </div>

        <!-- Obrzeże -->
        <div class="detail-section" x-show="selected.edge">
          <h3>Obrzeże</h3>
          <table class="detail-table">
            <tr>
              <td>Kod</td>
              <td><strong x-text="selected.edge?.code"></strong></td>
            </tr>
            <tr x-show="selected.edge?.supplier">
              <td>Dostawca</td>
              <td x-text="selected.edge?.supplier"></td>
            </tr>
            <tr x-show="selected.edge?.finish">
              <td>Wykończenie</td>
              <td x-text="selected.edge?.finish + (edgeFinishDesc(selected.edge?.finish) ? ' — ' + edgeFinishDesc(selected.edge?.finish) : '')"></td>
            </tr>
            <tr x-show="selected.edge?.material">
              <td>Materiał</td>
              <td x-text="selected.edge?.material"></td>
            </tr>
          </table>
        </div>

        <!-- Kolory referencyjne -->
        <div class="detail-section" x-show="selected.ncs || selected.ral || selected.pantone">
          <h3>Kolory referencyjne</h3>
          <table class="detail-table">
            <tr x-show="selected.ncs">
              <td>NCS</td>
              <td x-text="selected.ncs"></td>
            </tr>
            <tr x-show="selected.ral">
              <td>RAL</td>
              <td x-text="selected.ral"></td>
            </tr>
            <tr x-show="selected.pantone">
              <td>Pantone</td>
              <td x-text="selected.pantone"></td>
            </tr>
          </table>
        </div>

        <!-- Blat / HDF -->
        <div class="detail-section" x-show="selected.countertop || selected.hdf_laminate !== undefined">
          <h3>Dodatkowe produkty</h3>
          <table class="detail-table">
            <tr x-show="selected.countertop">
              <td>Blat roboczy</td>
              <td><strong x-text="selected.countertop"></strong></td>
            </tr>
            <tr x-show="selected.hdf_laminate !== undefined">
              <td>HDF laminat</td>
              <td x-text="selected.hdf_laminate ? 'Dostępny (0.8mm)' : 'Niedostępny'"></td>
            </tr>
            <tr x-show="selected.global_decor_id">
              <td>Dekor bazowy (Global)</td>
              <td x-text="selected.global_decor_id"></td>
            </tr>
          </table>
        </div>

        <!-- Uwagi -->
        <div class="detail-section" x-show="selected.notes">
          <h3>Uwagi</h3>
          <p style="font-size:13px; color:var(--muted)" x-text="selected.notes"></p>
        </div>
      </div>
    </div>
  </template>

  <script>
    function catalog() {
      return {
        loading: true,
        error: null,
        meta: {},
        allDecors: [],
        search: '',
        activeProducer: null,
        activeSurfaceType: null,
        activeStructure: null,
        activeTag: null,
        activeMaterial: null,
        activeColorFamily: null,
        selected: null,
        showAllTags: false,
        showAllColors: false,
        structures: {},
        surfaceTypes: {},
        edgeFinishes: {},

        // ── Computed ──

        get totalDecors() {
          return this.allDecors.length;
        },

        get producers() {
          return [...new Set(this.allDecors.map(d => d._producer))];
        },

        get surfaceTypeOptions() {
          const counts = {};
          this.allDecors.forEach(d => {
            const st = this.surfaceTypes[d.structure];
            if (st) counts[st] = (counts[st] || 0) + 1;
          });
          return Object.entries(counts)
            .map(([key, count]) => ({ key, label: this.surfaceTypeLabel(key), count }))
            .sort((a, b) => b.count - a.count);
        },

        get structureOptions() {
          const counts = {};
          this.allDecors.forEach(d => {
            counts[d.structure] = (counts[d.structure] || 0) + 1;
          });
          return Object.entries(counts)
            .map(([code, count]) => ({
              code,
              name: this.structures[code]?.name || code,
              count
            }))
            .sort((a, b) => b.count - a.count);
        },

        get materialOptions() {
          const counts = {};
          this.allDecors.forEach(d => {
            if (d.material) counts[d.material] = (counts[d.material] || 0) + 1;
          });
          return Object.entries(counts)
            .map(([key, count]) => ({
              key,
              label: {
                chipboard: 'Płyta wiórowa',
                mdf_acrylic: 'MDF Akryl',
                mdf_lacquered: 'MDF Lakierowany',
                mdf_foil: 'MDF Folia',
                compact: 'Compact HPL',
                hpl: 'HPL',
                worktop: 'Blat',
                splashback: 'Splashback'
              }[key] || key,
              count
            }))
            .sort((a, b) => b.count - a.count);
        },

        get colorFamilyOptions() {
          const counts = {};
          this.allDecors.forEach(d => {
            if (d.color_family) counts[d.color_family] = (counts[d.color_family] || 0) + 1;
          });
          return Object.entries(counts)
            .map(([key, count]) => ({ key, count }))
            .sort((a, b) => b.count - a.count);
        },

        get tagOptions() {
          const counts = {};
          this.allDecors.forEach(d => {
            (d.tags || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; });
          });
          return Object.entries(counts)
            .map(([tag, count]) => ({ tag, count }))
            .sort((a, b) => b.count - a.count);
        },

        get filtered() {
          let r = this.allDecors;

          if (this.activeProducer)
            r = r.filter(d => d._producer === this.activeProducer);

          if (this.activeSurfaceType)
            r = r.filter(d => this.surfaceTypes[d.structure] === this.activeSurfaceType);

          if (this.activeStructure)
            r = r.filter(d => d.structure === this.activeStructure);

          if (this.activeTag)
            r = r.filter(d => (d.tags || []).includes(this.activeTag));

          if (this.activeMaterial)
            r = r.filter(d => d.material === this.activeMaterial);

          if (this.activeColorFamily)
            r = r.filter(d => d.color_family === this.activeColorFamily);

          if (this.search.trim()) {
            const q = this.search.trim().toLowerCase();
            r = r.filter(d =>
              d.name.toLowerCase().includes(q) ||
              d.id.toLowerCase().includes(q) ||
              (d.tags || []).some(t => t.toLowerCase().includes(q)) ||
              d.structure.toLowerCase().includes(q) ||
              (d.group || '').toLowerCase().includes(q)
            );
          }

          return r;
        },

        // ── Methods ──

        toggle(field, value) {
          this[field] = this[field] === value ? null : value;
        },

        producerCount(p) {
          return this.allDecors.filter(d => d._producer === p).length;
        },

        surfaceTypeLabel(key) {
          const labels = {
            smooth_matt: 'Gładki mat',
            pearl_silk: 'Perłowy jedwab',
            wood_grain: 'Faktura drewna',
            stone: 'Kamień / Beton',
            gloss: 'Połysk',
            metal: 'Metal',
          };
          return labels[key] || key;
        },

        sidednessLabel(s) {
          const labels = {
            one_sided: 'Jednostronna',
            two_sided_same: 'Dwustronna (ten sam dekor)',
            two_sided_different: 'Dwustronna (różne dekory)',
          };
          return labels[s] || s;
        },

        edgeFinishDesc(code) {
          return this.edgeFinishes[code] || '';
        },

        openDetail(decor) {
          this.selected = decor;
        },

        async load() {
          try {
            const res = await fetch('/catalog/full');
            if (!res.ok) throw new Error('Nie można załadować catalog.json');
            const data = await res.json();

            this.meta = { generated: data._generated, stats: data.stats };

            // Structures per producer
            for (const [producer, pData] of Object.entries(data.producers || {})) {
              const structs = pData.collections?.structures || {};
              for (const [code, info] of Object.entries(structs)) {
                this.structures[code] = info;
              }
              const finishes = pData.collections?.edge_finishes || {};
              for (const [code, desc] of Object.entries(finishes)) {
                this.edgeFinishes[code] = desc;
              }
            }

            // Surface types from shared
            if (data.shared?.surface_types) {
              for (const [typeName, typeData] of Object.entries(data.shared.surface_types)) {
                for (const code of (typeData.kronospan_structures || []))
                  this.surfaceTypes[code] = typeName;
                for (const code of (typeData.swiss_krono_structures || []))
                  this.surfaceTypes[code] = typeName;
                for (const code of (typeData.egger_structures || []))
                  this.surfaceTypes[code] = typeName;
              }
            }

            // Flatten decors → variants (each variant is a card)
            const decors = [];
            for (const [producer, pData] of Object.entries(data.producers || {})) {
              const shortName = { kronospan: 'KP', swiss_krono: 'SK', egger: 'EG' }[producer] || producer.slice(0, 2).toUpperCase();
              for (const decor of (pData.decors || [])) {
                for (const variant of (decor.variants || [])) {
                  const structInfo = this.structures[variant.structure] || {};
                  const surfaceType = this.surfaceTypes[variant.structure];
                  const imgPath = decor.img_url;
                  decors.push({
                    // Decor-level (identity)
                    id: decor.id,
                    name: decor.name,
                    group: decor.group,
                    color_family: decor.color_family,
                    ncs: decor.ncs,
                    ral: decor.ral,
                    pantone: decor.pantone,
                    tags: decor.tags,
                    img: decor.img,
                    // Variant-level (material)
                    variant_id: variant.id,
                    material: variant.material,
                    collection: variant.collection,
                    structure: variant.structure,
                    roles: variant.roles,
                    thickness_mm: variant.thickness_mm,
                    format: variant.format,
                    sidedness: variant.sidedness,
                    edge: variant.edge,
                    multi_structures: variant.multi_structures,
                    express: variant.express,
                    // UI helpers
                    _producer: producer,
                    _producerShort: shortName,
                    _key: `${producer}:${variant.id}`,
                    _imgPath: imgPath,
                    _structureName: structInfo.name || variant.structure,
                    _structureDesc: structInfo.description || '',
                    _surfaceTypeShort: surfaceType ? this.surfaceTypeLabel(surfaceType).split(' ')[0] : '',
                    _multiStructures: variant.multi_structures || '',
                    _allStructures: variant.multi_structures ? `${variant.structure}, ${variant.multi_structures}` : variant.structure,
                    _materialLabel: {
                      chipboard: 'Płyta wiórowa',
                      mdf_acrylic: 'MDF Akryl',
                      mdf_lacquered: 'MDF Lakierowany',
                      mdf_foil: 'MDF Folia',
                      compact: 'Compact HPL',
                      hpl: 'HPL',
                      worktop: 'Blat',
                      splashback: 'Splashback'
                    }[variant.material] || variant.material,
                  });
                }
              }
            }

            this.allDecors = decors;
            this.loading = false;
          } catch (e) {
            this.error = e.message;
            this.loading = false;
          }
        },
      };
    }
  </script>
</body>
</html>
