<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katalog Materialow</title>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
  <style>
    :root {
      --bg: #f5f5f5;
      --card: #ffffff;
      --border: #e0e0e0;
      --accent: #2c5f4a;
      --accent-light: #e8f0ec;
      --text: #1a1a1a;
      --muted: #6b6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }
    header .meta {
      font-size: 12px;
      color: var(--muted);
    }
    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .toolbar input[type="search"] {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      min-width: 200px;
    }
    .chip {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      transition: all 0.15s;
    }
    .chip:hover { border-color: var(--accent); }
    .chip.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .stats {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
    }
    main {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: box-shadow 0.15s;
    }
    .card:hover {
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .card-swatch {
      height: 100px;
      background: linear-gradient(135deg, #d4cfc7 0%, #e8e4dc 100%);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
    }
    .card-swatch img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-swatch .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--accent);
      color: white;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .card-body {
      padding: 10px 12px;
    }
    .card-body .name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }
    .card-body .code {
      font-size: 11px;
      color: var(--muted);
      font-family: monospace;
    }
    .card-body .structure {
      font-size: 11px;
      color: var(--accent);
      margin-top: 4px;
    }
    .card-body .tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .card-body .tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--accent-light);
      color: var(--accent);
    }
    .card-body .products {
      display: flex;
      gap: 4px;
      margin-top: 6px;
    }
    .card-body .prod-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
    }
    .prod-dot.available { background: #d4edda; color: #155724; }
    .prod-dot.unavailable { background: #f8f9fa; color: #ccc; }

    .detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .detail-panel {
      background: var(--card);
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
    }
    .detail-panel h2 { font-size: 20px; margin-bottom: 4px; }
    .detail-panel .close {
      float: right;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--muted);
    }
    .detail-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 13px;
    }
    .detail-table th {
      text-align: left;
      padding: 8px;
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 600;
    }
    .detail-table td {
      padding: 8px;
      border-bottom: 1px solid var(--border);
    }

    .loading {
      text-align: center;
      padding: 60px;
      color: var(--muted);
    }
    .error {
      text-align: center;
      padding: 40px;
      color: #dc3545;
    }
  </style>
</head>
<body x-data="catalog()" x-init="load()">

  <!-- HEADER -->
  <header>
    <h1>Katalog Materialow</h1>
    <div class="meta">
      <span x-text="meta.generated ? 'Wygenerowano: ' + new Date(meta.generated).toLocaleString('pl') : ''"></span>
      <span x-show="meta.stats" x-text="meta.stats ? ' | Dekorow: ' + Object.values(meta.stats).reduce((a,b) => a+b, 0) : ''"></span>
    </div>

    <div class="toolbar">
      <input type="search" x-model="search" placeholder="Szukaj dekoru, kodu, tagu..." />

      <template x-for="p in producers" :key="p">
        <button class="chip" :class="activeProducer === p && 'active'" @click="toggleProducer(p)" x-text="p"></button>
      </template>

      <template x-for="s in structureTypes" :key="s">
        <button class="chip" :class="activeStructureType === s && 'active'" @click="toggleStructureType(s)" x-text="s"></button>
      </template>

      <span class="stats">
        <span x-text="filtered.length"></span> / <span x-text="allDecors.length"></span>
      </span>
    </div>
  </header>

  <!-- CONTENT -->
  <main>
    <!-- Loading -->
    <div x-show="loading" class="loading">Ladowanie katalogu...</div>
    <div x-show="error" class="error" x-text="error"></div>

    <!-- Grid -->
    <div x-show="!loading && !error" class="grid">
      <template x-for="decor in filtered" :key="decor._key">
        <div class="card" @click="openDetail(decor)">
          <div class="card-swatch">
            <template x-if="decor.img">
              <img :src="decor._imgPath" :alt="decor.name" />
            </template>
            <span class="badge" x-text="decor._producer"></span>
          </div>
          <div class="card-body">
            <div class="name" x-text="decor.name"></div>
            <div class="code" x-text="decor.id"></div>
            <div class="structure" x-text="decor._structureLabel"></div>
            <div class="tags">
              <template x-for="tag in (decor.tags || []).slice(0, 3)" :key="tag">
                <span class="tag" x-text="tag"></span>
              </template>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- Empty state -->
    <div x-show="!loading && !error && filtered.length === 0" class="loading">
      Brak wynikow dla "<span x-text="search"></span>"
    </div>
  </main>

  <!-- DETAIL OVERLAY -->
  <template x-if="selected">
    <div class="detail-overlay" @click.self="selected = null">
      <div class="detail-panel">
        <button class="close" @click="selected = null">&times;</button>
        <h2 x-text="selected.name"></h2>
        <div class="code" x-text="selected.id + ' | ' + selected._producer"></div>
        <div class="structure" x-text="selected._structureLabel" style="margin-top:4px"></div>

        <table class="detail-table">
          <tr>
            <th>Pole</th>
            <th>Wartosc</th>
          </tr>
          <tr>
            <td>Struktura</td>
            <td x-text="selected.structure"></td>
          </tr>
          <tr x-show="selected.thickness_mm">
            <td>Grubosc</td>
            <td x-text="selected.thickness_mm + ' mm'"></td>
          </tr>
          <tr x-show="selected.format">
            <td>Format</td>
            <td x-text="selected.format ? selected.format.join(' x ') + ' mm' : ''"></td>
          </tr>
          <tr x-show="selected.sidedness">
            <td>Stronnosc</td>
            <td x-text="selected.sidedness"></td>
          </tr>
          <tr x-show="selected.group">
            <td>Grupa</td>
            <td x-text="selected.group"></td>
          </tr>
          <tr x-show="selected.konfekcja !== undefined">
            <td>Konfekcja</td>
            <td x-text="selected.konfekcja ? 'Tak' : 'Nie'"></td>
          </tr>
          <tr x-show="selected.global_decor_id">
            <td>Dekor Global</td>
            <td x-text="selected.global_decor_id"></td>
          </tr>
          <tr x-show="selected.ncs">
            <td>NCS</td>
            <td x-text="selected.ncs"></td>
          </tr>
          <tr x-show="selected.ral">
            <td>RAL</td>
            <td x-text="selected.ral"></td>
          </tr>
          <tr x-show="selected.pantone">
            <td>Pantone</td>
            <td x-text="selected.pantone"></td>
          </tr>
          <template x-if="selected.edge">
            <tr>
              <td>Obrzeze</td>
              <td>
                <span x-text="selected.edge.code"></span>
                <span x-show="selected.edge.finish" x-text="' (' + selected.edge.finish + ')'"></span>
              </td>
            </tr>
          </template>
          <tr x-show="selected.countertop">
            <td>Blat</td>
            <td x-text="selected.countertop"></td>
          </tr>
          <tr x-show="selected.hdf_laminate !== undefined">
            <td>HDF laminat</td>
            <td x-text="selected.hdf_laminate ? 'Tak' : 'Nie'"></td>
          </tr>
          <tr x-show="selected.notes">
            <td>Uwagi</td>
            <td x-text="selected.notes"></td>
          </tr>
        </table>
      </div>
    </div>
  </template>

  <script>
    function catalog() {
      return {
        loading: true,
        error: null,
        meta: {},
        allDecors: [],
        search: '',
        activeProducer: null,
        activeStructureType: null,
        selected: null,
        structures: {},
        surfaceTypes: {},

        get producers() {
          return [...new Set(this.allDecors.map(d => d._producer))];
        },

        get structureTypes() {
          const types = new Set();
          this.allDecors.forEach(d => {
            const st = this.surfaceTypes[d.structure];
            if (st) types.add(st);
          });
          return [...types].sort();
        },

        get filtered() {
          let r = this.allDecors;

          if (this.activeProducer) {
            r = r.filter(d => d._producer === this.activeProducer);
          }

          if (this.activeStructureType) {
            r = r.filter(d => this.surfaceTypes[d.structure] === this.activeStructureType);
          }

          if (this.search.trim()) {
            const q = this.search.trim().toLowerCase();
            r = r.filter(d =>
              d.name.toLowerCase().includes(q) ||
              d.id.toLowerCase().includes(q) ||
              (d.tags || []).some(t => t.toLowerCase().includes(q)) ||
              d.structure.toLowerCase().includes(q)
            );
          }

          return r;
        },

        toggleProducer(p) {
          this.activeProducer = this.activeProducer === p ? null : p;
        },

        toggleStructureType(s) {
          this.activeStructureType = this.activeStructureType === s ? null : s;
        },

        openDetail(decor) {
          this.selected = decor;
        },

        async load() {
          try {
            const res = await fetch('/catalog.json');
            if (!res.ok) throw new Error('Nie mozna zaladowac catalog.json');
            const data = await res.json();

            this.meta = {
              generated: data._generated,
              stats: data.stats,
            };

            // Build structure lookup
            const kronospan = data.producers?.kronospan?.collections;
            if (kronospan?.structures) {
              this.structures = kronospan.structures;
            }

            // Build surface type lookup
            if (data.shared?.surface_types) {
              for (const [typeName, typeData] of Object.entries(data.shared.surface_types)) {
                for (const code of (typeData.kronospan_structures || [])) {
                  this.surfaceTypes[code] = typeName;
                }
                for (const code of (typeData.swiss_krono_structures || [])) {
                  this.surfaceTypes[code] = typeName;
                }
                for (const code of (typeData.egger_structures || [])) {
                  this.surfaceTypes[code] = typeName;
                }
              }
            }

            // Flatten all decors with metadata
            const decors = [];
            for (const [producer, producerData] of Object.entries(data.producers || {})) {
              for (const decor of (producerData.decors || [])) {
                decors.push({
                  ...decor,
                  _producer: producer,
                  _key: `${producer}:${decor.id}`,
                  _imgPath: decor.img ? `/${producer}/${decor.img}` : null,
                  _structureLabel: this.structures[decor.structure]
                    ? `${this.structures[decor.structure].name} (${decor.structure})`
                    : decor.structure,
                });
              }
            }

            this.allDecors = decors;
            this.loading = false;
          } catch (e) {
            this.error = e.message;
            this.loading = false;
          }
        },
      };
    }
  </script>
</body>
</html>
