[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kitchen-agent"
version = "0.1.0"
description = "Local LLM agent for kitchen cabinet design and assembly"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Michal", email = "your.email@example.com"}
]

dependencies = [
    "google-genai>=0.3.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.30.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "mypy>=1.5.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/__init__.py",
    "tests/*",
    "*/__pycache__/*"
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "if 0:",
    "@abstractmethod"
]

[tool.ruff]
# Exclude E402 (module level import not at top of file)
# This is needed for src/app.py because of the sys.path.append hack
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
"src/app.py" = ["E402"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration",
]