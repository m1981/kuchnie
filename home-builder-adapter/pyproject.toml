[project]
name = "home-builder-adapter"
version = "0.1.0"
description = "Blender scene → kuchnie_core.Kitchen extractor (Anti-Corruption Layer for home_builder_5)"
requires-python = ">=3.10"
# bpy is the host-provided heavy dependency (Blender interpreter). ADR-009.
dependencies = [
    "kuchnie-core",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package literally lives at src/ (imported as ``src.extract`` etc.);
# tests fake ``bpy`` in conftest so they run outside Blender.
pythonpath = ["."]
addopts = "-v --tb=short"
