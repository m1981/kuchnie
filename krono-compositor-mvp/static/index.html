<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Krono Swiss - Konfigurator 2.5D</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <style>
            ::-webkit-scrollbar {
                width: 6px;
            }
            ::-webkit-scrollbar-track {
                background: #f1f5f9;
            }
            ::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                border-radius: 10px;
            }
        </style>
    </head>
    <body class="bg-slate-50 text-slate-800 h-screen overflow-hidden font-sans antialiased">
        <div
            x-data="kitchenConfigurator()"
            x-init="init()"
            class="flex flex-col md:flex-row h-full"
        >
            <!-- LEFT PANEL: The Rendered Image with ZOOM -->
            <div
                class="w-full md:w-2/3 lg:w-3/4 h-[50vh] md:h-full bg-slate-200 relative flex flex-col"
            >
                <!-- Top Bar: Scene & Angle Selection -->
                <div
                    class="absolute top-0 inset-x-0 p-4 z-20 flex justify-between items-center pointer-events-none"
                >
                    <div
                        class="bg-white/90 backdrop-blur shadow-sm rounded-lg p-2 pointer-events-auto flex items-center space-x-3"
                    >
                        <!-- Angle Selector -->
                        <template x-if="catalog">
                            <select
                                x-model="activeAngle"
                                @change="renderKitchen()"
                                class="bg-transparent font-medium text-sm outline-none cursor-pointer text-slate-700"
                            >
                                <template
                                    x-for="angle in catalog.scenes[0].angles"
                                    :key="angle.angle_id"
                                >
                                    <option :value="angle.angle_id" x-text="angle.name"></option>
                                </template>
                            </select>
                        </template>

                        <!-- Divider -->
                        <div class="w-px h-4 bg-slate-300"></div>

                        <!-- NEW: Handle Selector -->
                        <select
                            x-model="activeHandle"
                            @change="renderKitchen()"
                            class="bg-transparent font-medium text-sm outline-none cursor-pointer text-slate-700"
                        >
                            <option value="edge_pull">Uchwyty Krawędziowe</option>
                            <option value="">Bez Uchwytów (Tip-On)</option>
                        </select>
                    </div>
                    <div
                        class="bg-white/90 backdrop-blur shadow-sm rounded-lg px-3 py-1.5 pointer-events-auto text-xs font-bold text-slate-500"
                    >
                        Najedź myszką, aby przybliżyć (Zoom)
                    </div>
                </div>

                <!-- Image Container (Handles Zoom Logic) -->
                <div
                    class="flex-1 relative overflow-hidden flex items-center justify-center p-8"
                    @mousemove="updateZoom($event)"
                    @mouseenter="isZoomed = true"
                    @mouseleave="isZoomed = false"
                >
                    <!-- Loading Spinner -->
                    <div
                        x-show="isLoading"
                        class="absolute inset-0 bg-slate-900/10 backdrop-blur-sm flex flex-col items-center justify-center z-10"
                    >
                        <svg
                            class="animate-spin h-10 w-10 text-slate-800 mb-4"
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                        >
                            <circle
                                class="opacity-25"
                                cx="12"
                                cy="12"
                                r="10"
                                stroke="currentColor"
                                stroke-width="4"
                            ></circle>
                            <path
                                class="opacity-75"
                                fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                            ></path>
                        </svg>
                    </div>

                    <!-- The Rendered Image -->
                    <img
                        x-show="imageUrl"
                        :src="imageUrl"
                        class="max-w-full max-h-full object-contain shadow-2xl transition-transform duration-200 ease-out cursor-crosshair"
                        :style="isZoomed ? `transform: scale(2.5); transform-origin: ${zoomX}% ${zoomY}%;` : 'transform: scale(1);'"
                        :class="isLoading ? 'opacity-50' : 'opacity-100'"
                        alt="Kitchen Render"
                    />
                </div>
            </div>

            <!-- RIGHT PANEL: Controls -->
            <div
                class="w-full md:w-1/3 lg:w-1/4 h-[50vh] md:h-full bg-white border-l border-slate-200 flex flex-col shadow-xl z-20"
            >
                <div class="p-6 border-b border-slate-100">
                    <h1 class="text-2xl font-bold text-slate-900">Krono Swiss</h1>
                    <p class="text-sm text-slate-500 mt-1">Konfigurator Wnętrz 2.5D</p>
                </div>

                <div class="flex-1 overflow-y-auto p-6" x-show="catalog">
                    <!-- 1. Zone Selection -->
                    <div class="mb-8">
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                            1. Wybierz Element
                        </h2>
                        <div class="flex flex-col space-y-2">
                            <template x-for="zone in zones" :key="zone.id">
                                <button
                                    @click="activeZoneId = zone.id"
                                    class="px-4 py-3 rounded-lg text-left font-medium transition-all duration-200 border flex justify-between items-center"
                                    :class="activeZoneId === zone.id ? 'bg-blue-50 border-blue-200 text-blue-700 shadow-sm' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'"
                                >
                                    <span x-text="zone.name"></span>
                                    <span
                                        class="w-4 h-4 rounded-full border border-slate-300 shadow-inner"
                                        :style="`background-color: ${getMaterialColor(zone.texture_id)}`"
                                    ></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- 2. Price Group Tabs -->
                    <div class="mb-4">
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                            2. Grupa Cenowa
                        </h2>
                        <div class="flex space-x-1 bg-slate-100 p-1 rounded-lg">
                            <template x-for="group in catalog.price_groups" :key="group.id">
                                <button
                                    @click="activePriceGroup = group.id"
                                    class="flex-1 py-1.5 text-sm font-medium rounded-md transition-all"
                                    :class="activePriceGroup === group.id ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                                    x-text="group.name"
                                ></button>
                            </template>
                        </div>
                    </div>

                    <!-- 3. Material Grid (Smart Filtered) -->
                    <div>
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                            3. Wybierz Dekor
                        </h2>

                        <div
                            x-show="filteredMaterials.length === 0"
                            class="text-sm text-slate-500 italic p-4 text-center bg-slate-50 rounded-lg"
                        >
                            Brak dekorów w tej grupie cenowej dla wybranego elementu.
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <template x-for="mat in filteredMaterials" :key="mat.id">
                                <button
                                    @click="applyMaterial(mat.id)"
                                    class="group relative aspect-square rounded-xl border-2 overflow-hidden transition-all duration-200"
                                    :class="isMaterialActive(mat.id) ? 'border-blue-500 shadow-md' : 'border-slate-200 hover:border-slate-300'"
                                >
                                    <div
                                        class="absolute inset-0 w-full h-full"
                                        :style="`background-color: ${mat.hex_color}`"
                                    ></div>

                                    <div
                                        class="absolute bottom-0 inset-x-0 bg-white/90 backdrop-blur text-[10px] font-medium p-2 text-center border-t border-slate-100 leading-tight"
                                        x-text="mat.name"
                                    ></div>

                                    <div
                                        x-show="isMaterialActive(mat.id)"
                                        class="absolute top-2 right-2 bg-blue-500 text-white rounded-full p-1 shadow-sm"
                                    >
                                        <svg
                                            class="w-3 h-3"
                                            fill="none"
                                            stroke="currentColor"
                                            viewBox="0 0 24 24"
                                        >
                                            <path
                                                stroke-linecap="round"
                                                stroke-linejoin="round"
                                                stroke-width="3"
                                                d="M5 13l4 4L19 7"
                                            ></path>
                                        </svg>
                                    </div>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function kitchenConfigurator() {
                return {
                    catalog: null,
                    isLoading: false,
                    imageUrl: null,

                    // State
                    activeScene: 'kitchen_01',
                    activeAngle: 'main',
                    activeZoneId: 'lower',
                    activePriceGroup: 1,
                    activeHandle: 'edge_pull',

                    // Zoom State
                    isZoomed: false,
                    zoomX: 50,
                    zoomY: 50,

                    // Our Kitchen Zones mapped to the backend payload requirements
                    zones: [
                        {
                            id: 'upper',
                            name: 'Szafki Górne',
                            type: 'FRONT',
                            mask_color_hex: '#0000FF',
                            texture_id: 'dab_szlachetny'
                        },
                        {
                            id: 'lower',
                            name: 'Szafki Dolne',
                            type: 'FRONT',
                            mask_color_hex: '#FF0000',
                            texture_id: 'zielony_kamienny'
                        },
                        {
                            id: 'counter',
                            name: 'Blat Roboczy',
                            type: 'COUNTERTOP',
                            mask_color_hex: '#00FF00',
                            texture_id: 'marmur_bianco'
                        }
                    ],

                    async init() {
                        // 1. Fetch the catalog from our new API endpoint
                        const res = await fetch('/api/v1/catalog');
                        this.catalog = await res.json();

                        // 2. Render the initial kitchen
                        this.renderKitchen();
                    },

                    // --- SMART FILTERING LOGIC ---
                    get filteredMaterials() {
                        if (!this.catalog) return [];
                        const currentZone = this.zones.find((z) => z.id === this.activeZoneId);

                        return this.catalog.materials.filter((m) => {
                            // Rule 1: Must match selected Price Group
                            if (m.price_group !== this.activePriceGroup) return false;

                            // Rule 2: Business Constraints (Front Only / Countertop Only)
                            if (m.allowed_zone === 'FRONT_ONLY' && currentZone.type !== 'FRONT')
                                return false;
                            if (
                                m.allowed_zone === 'COUNTERTOP_ONLY' &&
                                currentZone.type !== 'COUNTERTOP'
                            )
                                return false;

                            return true;
                        });
                    },

                    // --- ZOOM LOGIC ---
                    updateZoom(event) {
                        if (!this.isZoomed) return;
                        const rect = event.currentTarget.getBoundingClientRect();
                        // Calculate mouse position as a percentage of the container
                        this.zoomX = ((event.clientX - rect.left) / rect.width) * 100;
                        this.zoomY = ((event.clientY - rect.top) / rect.height) * 100;
                    },

                    // --- UI HELPERS ---
                    isMaterialActive(materialId) {
                        return (
                            this.zones.find((z) => z.id === this.activeZoneId).texture_id ===
                            materialId
                        );
                    },
                    getMaterialColor(materialId) {
                        if (!this.catalog) return '#ccc';
                        const mat = this.catalog.materials.find((m) => m.id === materialId);
                        return mat ? mat.hex_color : '#ccc';
                    },

                    // --- ACTIONS ---
                    applyMaterial(materialId) {
                        if (this.isMaterialActive(materialId)) return;
                        const zoneIndex = this.zones.findIndex((z) => z.id === this.activeZoneId);
                        this.zones[zoneIndex].texture_id = materialId;
                        this.renderKitchen();
                    },

                    async renderKitchen() {
                        this.isLoading = true;

                        const payload = {
                            scene_id: this.activeScene,
                            angle_id: this.activeAngle,
                            uv_scale_mm: 1000.0,
                            handle_id: this.activeHandle || null,
                            zones: this.zones.map((z) => ({
                                mask_color_hex: z.mask_color_hex,
                                texture_id: z.texture_id,
                                zone_type: z.type
                            }))
                        };

                        try {
                            const response = await fetch('/api/v1/render', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });

                            if (!response.ok) {
                                const err = await response.json();
                                throw new Error(err.detail || 'Render failed');
                            }

                            const blob = await response.blob();
                            if (this.imageUrl) URL.revokeObjectURL(this.imageUrl);
                            this.imageUrl = URL.createObjectURL(blob);
                        } catch (error) {
                            console.error('Error:', error);
                            alert('Błąd: ' + error.message);
                        } finally {
                            this.isLoading = false;
                        }
                    }
                };
            }
        </script>
    </body>
</html>
