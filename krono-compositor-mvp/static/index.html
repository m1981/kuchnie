<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Krono 2.5D Configurator</title>
        <!-- Tailwind CSS (CDN) -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Alpine.js (CDN) -->
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

        <style>
            /* Custom scrollbar for a premium feel */
            ::-webkit-scrollbar {
                width: 6px;
            }
            ::-webkit-scrollbar-track {
                background: #f1f5f9;
            }
            ::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                border-radius: 10px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #94a3b8;
            }
        </style>
    </head>
    <body class="bg-slate-50 text-slate-800 h-screen overflow-hidden font-sans antialiased">
        <!-- Alpine Component Scope -->
        <div
            x-data="kitchenConfigurator()"
            x-init="init()"
            class="flex flex-col md:flex-row h-full"
        >
            <!-- LEFT PANEL: The Rendered Image (70%) -->
            <div
                class="w-full md:w-2/3 lg:w-3/4 h-[50vh] md:h-full bg-slate-200 relative flex items-center justify-center p-4 md:p-8"
            >
                <!-- Loading Overlay -->
                <div
                    x-show="isLoading"
                    x-transition.opacity.duration.300ms
                    class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm flex flex-col items-center justify-center z-10 rounded-xl m-4 md:m-8"
                >
                    <svg
                        class="animate-spin h-10 w-10 text-white mb-4"
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                    >
                        <circle
                            class="opacity-25"
                            cx="12"
                            cy="12"
                            r="10"
                            stroke="currentColor"
                            stroke-width="4"
                        ></circle>
                        <path
                            class="opacity-75"
                            fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                        ></path>
                    </svg>
                    <span class="text-white font-medium tracking-wide"
                        >Rendering with OpenCV...</span
                    >
                </div>

                <!-- The Actual Image -->
                <img
                    x-show="imageUrl"
                    :src="imageUrl"
                    class="max-w-full max-h-full object-contain shadow-2xl rounded-xl transition-opacity duration-500"
                    :class="isLoading ? 'opacity-50' : 'opacity-100'"
                    alt="Kitchen Render"
                />

                <!-- Placeholder before first load -->
                <div
                    x-show="!imageUrl && !isLoading"
                    class="text-slate-400 flex flex-col items-center"
                >
                    <svg
                        class="w-16 h-16 mb-4"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="1.5"
                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                        ></path>
                    </svg>
                    <p>Initializing Engine...</p>
                </div>
            </div>

            <!-- RIGHT PANEL: Controls (30%) -->
            <div
                class="w-full md:w-1/3 lg:w-1/4 h-[50vh] md:h-full bg-white border-l border-slate-200 flex flex-col shadow-xl z-20"
            >
                <!-- Header -->
                <div class="p-6 border-b border-slate-100">
                    <h1 class="text-2xl font-bold text-slate-900">Krono Swiss</h1>
                    <p class="text-sm text-slate-500 mt-1">2.5D Kitchen Configurator</p>
                </div>

                <!-- Scrollable Content -->
                <div class="flex-1 overflow-y-auto p-6">
                    <!-- Zone Selection Tabs -->
                    <div class="mb-8">
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                            1. Select Zone
                        </h2>
                        <div class="flex flex-col space-y-2">
                            <template x-for="zone in zones" :key="zone.id">
                                <button
                                    @click="activeZoneId = zone.id"
                                    class="px-4 py-3 rounded-lg text-left font-medium transition-all duration-200 border flex justify-between items-center"
                                    :class="activeZoneId === zone.id ? 'bg-blue-50 border-blue-200 text-blue-700 shadow-sm' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'"
                                >
                                    <span x-text="zone.name"></span>
                                    <!-- Small color indicator of current material -->
                                    <span
                                        class="w-4 h-4 rounded-full border border-slate-300 shadow-inner"
                                        :style="`background-color: ${getMaterialColor(zone.texture_id)}`"
                                    ></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- Material Selection Grid -->
                    <div>
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                            2. Select Material
                            <span
                                class="text-slate-500 font-normal normal-case"
                                x-text="`for ${getActiveZoneName()}`"
                            ></span>
                        </h2>
                        <div class="grid grid-cols-2 gap-3">
                            <template x-for="mat in materials" :key="mat.id">
                                <button
                                    @click="applyMaterial(mat.id)"
                                    class="group relative aspect-square rounded-xl border-2 overflow-hidden transition-all duration-200"
                                    :class="isMaterialActive(mat.id) ? 'border-blue-500 shadow-md' : 'border-slate-200 hover:border-slate-300'"
                                >
                                    <!-- Fake Swatch Color (In a real app, this would be an img src) -->
                                    <div
                                        class="absolute inset-0 w-full h-full"
                                        :style="`background-color: ${mat.color}`"
                                    ></div>

                                    <!-- Label -->
                                    <div
                                        class="absolute bottom-0 inset-x-0 bg-white/90 backdrop-blur text-xs font-medium p-2 text-center border-t border-slate-100"
                                        x-text="mat.name"
                                    ></div>

                                    <!-- Active Checkmark -->
                                    <div
                                        x-show="isMaterialActive(mat.id)"
                                        class="absolute top-2 right-2 bg-blue-500 text-white rounded-full p-1 shadow-sm"
                                    >
                                        <svg
                                            class="w-3 h-3"
                                            fill="none"
                                            stroke="currentColor"
                                            viewBox="0 0 24 24"
                                        >
                                            <path
                                                stroke-linecap="round"
                                                stroke-linejoin="round"
                                                stroke-width="3"
                                                d="M5 13l4 4L19 7"
                                            ></path>
                                        </svg>
                                    </div>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Footer Actions -->
                <div class="p-6 border-t border-slate-100 bg-slate-50">
                    <button
                        @click="randomize()"
                        class="w-full py-3 px-4 bg-white border border-slate-300 rounded-lg text-slate-700 font-medium hover:bg-slate-50 hover:text-slate-900 transition-colors shadow-sm flex justify-center items-center space-x-2"
                    >
                        <svg
                            class="w-5 h-5 text-slate-400"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                            ></path>
                        </svg>
                        <span>Randomize Kitchen</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Alpine.js Logic -->
        <script>
            function kitchenConfigurator() {
                return {
                    isLoading: false,
                    imageUrl: null,
                    activeZoneId: 'lower', // Default selected tab

                    // Our available materials (matching the files in assets/textures/)
                    materials: [
                        { id: 'wood_oak', name: 'Krono Oak', color: '#8B5A2B', width_mm: 1200.0 },
                        {
                            id: 'marble_white',
                            name: 'White Marble',
                            color: '#F3F4F6',
                            width_mm: 2000.0
                        }
                    ],

                    // The current state of the kitchen
                    zones: [
                        {
                            id: 'upper',
                            name: 'Upper Cabinets',
                            mask_color_hex: '#0000FF',
                            texture_id: 'wood_oak'
                        },
                        {
                            id: 'lower',
                            name: 'Lower Cabinets',
                            mask_color_hex: '#FF0000',
                            texture_id: 'wood_oak'
                        },
                        {
                            id: 'counter',
                            name: 'Countertop',
                            mask_color_hex: '#00FF00',
                            texture_id: 'marble_white'
                        }
                    ],

                    // Initialization
                    init() {
                        this.renderKitchen();
                    },

                    // Helpers for the UI
                    getActiveZoneName() {
                        return this.zones.find((z) => z.id === this.activeZoneId).name;
                    },
                    isMaterialActive(materialId) {
                        const activeZone = this.zones.find((z) => z.id === this.activeZoneId);
                        return activeZone.texture_id === materialId;
                    },
                    getMaterialColor(materialId) {
                        return this.materials.find((m) => m.id === materialId).color;
                    },

                    // Actions
                    applyMaterial(materialId) {
                        if (this.isMaterialActive(materialId)) return; // Don't re-render if same

                        // Update state
                        const zoneIndex = this.zones.findIndex((z) => z.id === this.activeZoneId);
                        this.zones[zoneIndex].texture_id = materialId;

                        // Trigger API call
                        this.renderKitchen();
                    },

                    randomize() {
                        this.zones.forEach((zone) => {
                            const randomMat =
                                this.materials[Math.floor(Math.random() * this.materials.length)];
                            zone.texture_id = randomMat.id;
                        });
                        this.renderKitchen();
                    },

                    // The Core API Call
                    async renderKitchen() {
                        this.isLoading = true;

                        // Build the payload exactly as our Pydantic schema expects
                        const payload = {
                            scene_id: 'kitchen_01',
                            uv_scale_mm: 1000.0,
                            zones: this.zones.map((z) => {
                                const mat = this.materials.find((m) => m.id === z.texture_id);
                                return {
                                    mask_color_hex: z.mask_color_hex,
                                    texture_id: z.texture_id,
                                    texture_width_mm: mat.width_mm
                                };
                            })
                        };

                        try {
                            const response = await fetch('/api/v1/render', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });

                            if (!response.ok) throw new Error('Render failed');

                            // Convert the raw JPEG bytes into a browser-readable Blob URL
                            const blob = await response.blob();

                            // Clean up old blob to prevent memory leaks
                            if (this.imageUrl) URL.revokeObjectURL(this.imageUrl);

                            this.imageUrl = URL.createObjectURL(blob);
                        } catch (error) {
                            console.error('Error rendering kitchen:', error);
                            alert('Failed to render kitchen. Check console.');
                        } finally {
                            this.isLoading = false;
                        }
                    }
                };
            }
        </script>
    </body>
</html>
