[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "krono-compositor-mvp"
version = "0.1.0"
description = "Local 2.5D Image Compositing Engine MVP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "fastapi>=0.136.3",
    "numpy>=1.24.0",
    # Using headless because this is a server-side engine (no GUI needed)
    "opencv-python-headless>=4.8.0",
    "uvicorn>=0.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.5.0",
    "pytest-cov>=7.1.0",
]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["src "]
branch = true
omit = [
    "*/__init__.py",
    "tests/*",
    "*/__pycache__/*",
    "*/tests/*"
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "@abstractmethod"
]

[tool.ruff]
# Exclude E402 (module level import not at top of file) for all test files
[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["E402"]
"src/main.py" = ["E402"]

