[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "krono-compositor-mvp"
version = "0.1.0"
description = "Local 2.5D Image Compositing Engine MVP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "numpy>=1.24.0",
    # Using headless because this is a server-side engine (no GUI needed)
    "opencv-python-headless>=4.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.5.0"
]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]